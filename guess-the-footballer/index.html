<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แข้งปริศนา</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="เกมทายชื่อนักเตะจากคำใบ้ 5 ข้อ ยิ่งใช้คำใบ้น้อย ยิ่งได้ยิงจากไกลและได้แต้มมาก">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,500;0,700;1,800&family=Sarabun:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@900&display=swap">
<style>
/* Layout: one narrow matchday column laid on the turf — LED scoreboard, a to-scale strip of pitch
   that works as the points meter, then the player's registration sheet whose five rows are the
   clues and whose name field is the answer box. Light theme is a day game, dark is a night game. */
:root{
  --turf:#1f6a3e; --turf-2:#1b6138; --turf-ink:#0d3520;      /* page ground and its mowing stripe */
  --pitch:#2f8f52; --pitch-2:#2a8349;                        /* the strip of pitch in play */
  --chalk:#f5faf2; --chalk-dim:#cfe3d3;                      /* line markings, type on turf */
  --paper:#fbfcf6; --paper-2:#edf1e4; --rule:#c9d3c2;        /* registration sheet */
  --ink:#13251a; --ink-soft:#4f6356;
  --board:#0b140f; --board-2:#1a2a20; --led:#ffb627; --led-dim:#7a5a1c;   /* scoreboard */
  --yellow:#ffd60a; --red:#d7263d;                           /* the referee's cards */
  --good:#0f7a3d; --alert:#b3152b;
  --ball:#ffffff; --ball-ink:#101613;
  --shade:rgba(4,20,10,.55);
  --f-display:"Kanit","Sarabun",system-ui,sans-serif;
  --f-body:"Sarabun","Kanit",system-ui,sans-serif;
  --f-led:"Doto","Kanit",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --turf:#0e2a1b; --turf-2:#0c2417; --turf-ink:#0a2014;
  --pitch:#1d6238; --pitch-2:#195731;
  --chalk:#eef5ec; --chalk-dim:#a9c2b0;
  --paper:#16241c; --paper-2:#203228; --rule:#35493d;
  --ink:#e9f1ea; --ink-soft:#a0b4a6;
  --board:#050a07; --board-2:#142018; --led:#ffb627; --led-dim:#6b4f18;
  --yellow:#ffd60a; --red:#ff4d5e;
  --good:#63d38e; --alert:#ff8a96;
  --ball:#ffffff; --ball-ink:#0b100d;
  --shade:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --turf:#0e2a1b; --turf-2:#0c2417; --turf-ink:#0a2014;
  --pitch:#1d6238; --pitch-2:#195731;
  --chalk:#eef5ec; --chalk-dim:#a9c2b0;
  --paper:#16241c; --paper-2:#203228; --rule:#35493d;
  --ink:#e9f1ea; --ink-soft:#a0b4a6;
  --board:#050a07; --board-2:#142018; --led:#ffb627; --led-dim:#6b4f18;
  --yellow:#ffd60a; --red:#ff4d5e;
  --good:#63d38e; --alert:#ff8a96;
  --ball:#ffffff; --ball-ink:#0b100d;
  --shade:rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:repeating-linear-gradient(90deg,transparent 0 64px,var(--turf-2) 64px 128px) var(--turf);
  color:var(--chalk);font-family:var(--f-body);font-size:1.0625rem;line-height:1.6;-webkit-text-size-adjust:100%}
.app{max-width:36rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 40px;display:grid;gap:14px}
h1,h2,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.sheet :focus-visible{outline-color:var(--ink)}

/* Masthead */
.mast{display:grid;gap:6px}
.eyebrow{font:500 .8rem/1.3 var(--f-display);letter-spacing:.08em;color:var(--chalk-dim)}
.mast h1{font:italic 800 clamp(2.3rem,10vw,3.1rem)/1.15 var(--f-display);letter-spacing:.01em;text-wrap:balance}
.lede{color:var(--chalk-dim);font-size:1rem;max-width:34em}
.decks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.deck{font:500 .92rem/1.3 var(--f-display);padding:.35rem .8rem;border-radius:999px;border:1.5px solid var(--chalk-dim);
  background:transparent;color:var(--chalk);cursor:pointer}
.deck:hover{border-color:var(--chalk)}
.deck[aria-checked="true"]{background:var(--chalk);border-color:var(--chalk);color:var(--turf-ink);font-weight:700}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:4px;padding:10px 12px;border:1.5px solid var(--chalk);border-radius:6px}
.confirm p{flex:1 1 14em;min-width:0;font-size:1rem}
.confirm div{display:flex;gap:8px}
.confirm .deck.yes{background:var(--chalk);color:var(--turf-ink);border-color:var(--chalk);font-weight:700}

/* Scoreboard */
.board{background:var(--board);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:10px 12px;
  align-items:end;box-shadow:inset 0 0 0 1px var(--board-2)}
.b-cell{display:grid;gap:4px}
.b-right{justify-items:end}
.b-label{font:500 .72rem/1 var(--f-display);letter-spacing:.1em;color:var(--chalk-dim)}
.b-num{font:900 2rem/1 var(--f-led);color:var(--led);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.b-num small{font-size:.55em;color:var(--led-dim)}
.b-lamps{grid-column:1/-1;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.b-lamps li{height:1.6rem;border-radius:3px;background:var(--board-2);display:grid;place-items:center;font:900 1rem/1 var(--f-led);color:var(--board)}
.b-lamps .goal{background:var(--led)}
.b-lamps .red{background:var(--red)}
.b-lamps .skip{background:var(--led-dim)}
.b-lamps .now{box-shadow:inset 0 0 0 2px var(--led);animation:blink 1.2s steps(2,jump-none) infinite}
@keyframes blink{50%{box-shadow:inset 0 0 0 2px var(--led-dim)}}

/* Pitch strip: 10 units = 1 metre, halfway line at x=0, goal line at x=525 */
.play{display:grid;gap:14px}
.pitch-wrap{display:grid;gap:4px}
.pitch{display:block;width:100%;height:auto}
.pitch .g1{fill:var(--pitch)}
.pitch .g2{fill:var(--pitch-2)}
.pitch .lines{fill:none;stroke:var(--chalk);stroke-width:2.5;opacity:.9}
.pitch .spot{fill:var(--chalk)}
.pitch .net{fill:none;stroke:var(--chalk);stroke-width:1;opacity:.7;transform-origin:525px 120px}
.pitch .frame{fill:none;stroke:var(--chalk);stroke-width:4;stroke-linejoin:round}
.pitch .shot{stroke:var(--chalk);stroke-width:2.5;stroke-dasharray:2 10;stroke-linecap:round;opacity:.8}
.pitch .ball{transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.pitch .ball circle{fill:var(--ball);stroke:var(--ball-ink);stroke-width:2}
.pitch .ball path{fill:var(--ball-ink)}
.pitch .mk line{stroke:var(--chalk-dim);stroke-width:2}
.pitch .mk circle{fill:none;stroke:var(--chalk-dim);stroke-width:2}
.pitch .mk text{fill:var(--chalk-dim);font:700 17px var(--f-display);text-anchor:middle}
.pitch .mk.on circle{fill:var(--chalk);stroke:var(--chalk)}
.pitch .mk.on text{fill:var(--turf-ink)}
.pitch .mk.past{opacity:.4}
.pitch-wrap[data-outcome="goal"] .ball{transition:transform .45s cubic-bezier(.5,0,.9,.4)}
.pitch-wrap[data-outcome="goal"] .net{animation:bulge .5s .4s ease-out both}
@keyframes bulge{40%{transform:scaleX(1.35)}}
.range{text-align:center;font:500 1rem/1.4 var(--f-display);color:var(--chalk)}
.range b{font-weight:700}

/* Registration sheet */
.sheet{background:var(--paper);color:var(--ink);border-radius:6px;padding:16px;display:grid;gap:12px;box-shadow:0 12px 26px -14px var(--shade)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.sheet-head h2{font:700 1.1rem/1.3 var(--f-display)}
.stamp{font:700 .8rem/1 var(--f-display);letter-spacing:.06em;color:var(--alert);border:2px solid var(--alert);border-radius:3px;padding:.3rem .5rem;transform:rotate(-3deg)}
.stamp.done{color:var(--ink-soft);border-color:var(--ink-soft);transform:none}
.sheet-side{font:500 .9rem/1.3 var(--f-display);color:var(--ink-soft)}

.clues{list-style:none;margin:0;padding:0;display:grid}
.clue{display:grid;gap:3px;padding:10px 0;border-bottom:1px dashed var(--rule)}
.clue-k{font:500 .82rem/1.4 var(--f-display);letter-spacing:.03em;color:var(--ink-soft);display:flex;gap:.5em;align-items:baseline}
.clue-k b{font-weight:700;color:var(--ink)}
.clue-k em{font-style:normal;font-size:.75rem;border:1px solid var(--rule);border-radius:3px;padding:0 .35em}
.clue-v{min-width:0;text-wrap:pretty}
.clue.locked .clue-k{opacity:.6}
.bar{display:block;height:.85rem;margin-block:.35rem;border-radius:2px;
  background:repeating-linear-gradient(-45deg,var(--paper-2) 0 6px,var(--rule) 6px 12px)}
.clue-open{width:100%;display:flex;align-items:center;gap:10px;font:500 1rem/1.3 var(--f-display);padding:.55rem .75rem;
  border:1.5px dashed var(--ink);border-radius:4px;background:var(--paper-2);color:var(--ink);cursor:pointer;text-align:left}
.clue-open::before{content:"+";font-weight:700;font-size:1.25rem;line-height:1}
.clue-open span:first-child{flex:1}
.clue-open .cost{font-size:.85rem;color:var(--ink-soft);white-space:nowrap}
.clue-open:hover{border-style:solid;background:var(--paper)}
@media (min-width:34rem){.clue{grid-template-columns:8rem 1fr;gap:12px;align-items:baseline}}

.facts{display:flex;flex-wrap:wrap;gap:2px 18px;margin:0}
.facts div{display:flex;gap:.45em;align-items:baseline}
.facts dt{font:500 .8rem/1.4 var(--f-display);color:var(--ink-soft)}
.facts dd{margin:0;font-weight:600}
.path{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 6px}
.path li{display:flex;align-items:center;gap:6px}
.path li:not(:last-child)::after{content:"";width:0;height:0;border-block:4px solid transparent;border-left:6px solid var(--ink-soft)}
.path span{background:var(--paper-2);border-radius:3px;padding:.05em .5em;font-weight:500}
.kit{display:flex;align-items:center;gap:14px}
.kit-svg{width:128px;height:auto;flex:none;color:var(--ink);background:var(--paper-2);border-radius:6px;padding:8px}
.kit-cap small{display:block;color:var(--ink-soft);font-size:.9rem}
.kit-cap .mask{font:700 1.05rem/1.4 var(--f-display);letter-spacing:.16em;color:var(--ink);white-space:nowrap}

/* Answer */
.answer{display:grid;gap:8px;padding-top:2px}
.answer label{font:500 .82rem/1.4 var(--f-display);letter-spacing:.03em;color:var(--ink-soft)}
.answer-row{display:flex;gap:8px;align-items:stretch}
.combo{position:relative;flex:1;min-width:0}
#guess{width:100%;height:100%;font:500 1.1rem/1.4 var(--f-body);padding:.6rem .7rem;border:1.5px solid var(--ink);border-radius:4px;background:var(--paper);color:var(--ink)}
#guess::placeholder{color:var(--ink-soft);opacity:.8;font-weight:400}
.suggest{position:absolute;left:0;right:0;bottom:calc(100% + 6px);z-index:5;list-style:none;margin:0;padding:4px;max-height:16rem;overflow:auto;
  background:var(--paper);border:1.5px solid var(--ink);border-radius:4px;box-shadow:0 -10px 24px -12px var(--shade)}
.suggest li{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 .6em;padding:.45rem .6rem;border-radius:3px;cursor:pointer}
.suggest li b{font-weight:600}
.suggest li span{font-size:.9rem;color:var(--ink-soft)}
.suggest li[aria-selected="true"],.suggest li:hover{background:var(--paper-2)}
.suggest li.used{opacity:.5;cursor:default;text-decoration:line-through}
.btn{font:700 1.05rem/1.3 var(--f-display);border-radius:4px;border:1.5px solid var(--ink);padding:.6rem 1.15rem;cursor:pointer}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.wide{width:100%}
.hint{font-size:.95rem;color:var(--alert)}
.hint:empty{display:none}
.hint.ok{color:var(--good)}
.bookings{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px}
.cards{display:flex;align-items:center;gap:7px;font-size:.92rem;color:var(--ink-soft)}
.card{width:15px;height:22px;border-radius:2.5px;border:1.5px dashed var(--rule);flex:none}
.card.y{background:var(--yellow);border:0;transform:rotate(-7deg);animation:book .3s ease-out}
.card.r{background:var(--red);border:0;transform:rotate(6deg)}
@keyframes book{from{transform:translateY(10px) rotate(0);opacity:0}}
.link{background:none;border:0;padding:.3rem 0;font:500 .92rem/1.3 var(--f-display);color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.link:hover{color:var(--ink)}

/* Verdict after each player */
.verdict{display:grid;gap:8px;padding-top:4px}
.v-call{font:italic 800 clamp(2.5rem,12vw,3.5rem)/1.15 var(--f-display);display:flex;align-items:center;gap:.3em}
.verdict[data-outcome="goal"] .v-call{color:var(--good);animation:slam .4s .3s cubic-bezier(.2,1.5,.4,1) both;transform-origin:left center}
.verdict[data-outcome="red"] .v-call{color:var(--alert)}
.verdict[data-outcome="skip"] .v-call{color:var(--ink-soft)}
.v-call .card{width:.5em;height:.72em;border-radius:.06em}
@keyframes slam{from{transform:scale(1.7) rotate(-4deg);opacity:0}}
.v-name{font:700 1.5rem/1.3 var(--f-display);text-wrap:balance}
.v-en{font:400 1rem/1.3 var(--f-body);color:var(--ink-soft);white-space:nowrap}
.v-note{color:var(--ink-soft)}
.verdict .btn{margin-top:6px}

/* Full time */
.f-score{display:flex;align-items:baseline;gap:.4em}
.f-num{font:italic 800 clamp(3.4rem,18vw,5rem)/1 var(--f-display)}
.f-max{font:500 1.1rem/1 var(--f-display);color:var(--ink-soft)}
.f-rank{font:700 1.45rem/1.3 var(--f-display)}
.f-line{color:var(--ink-soft)}
.f-list{list-style:none;margin:0;padding:0;display:grid;border-top:1px dashed var(--rule)}
.f-list li{display:grid;grid-template-columns:1.3rem 1fr auto 1.4rem;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--rule)}
.f-list .n{font:500 .85rem/1.4 var(--f-display);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.f-list .who{min-width:0;font-weight:600}
.f-list .who small{display:block;font-weight:400;font-size:.88rem;color:var(--ink-soft)}
.f-list .how{font-size:.9rem;color:var(--ink-soft);white-space:nowrap}
.f-list .red .how{color:var(--alert)}
.f-list .pts{font:700 1.1rem/1.4 var(--f-display);text-align:right;font-variant-numeric:tabular-nums}
.f-actions{display:flex;flex-wrap:wrap;gap:8px}
.f-actions .btn{flex:1 1 9em}
.share{width:100%;font:400 .95rem/1.5 var(--f-body);padding:.6rem;border:1.5px solid var(--ink);border-radius:4px;background:var(--paper-2);color:var(--ink);resize:none}

.foot{font-size:.88rem;color:var(--chalk-dim);text-align:center;padding-top:4px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <header class="mast">
    <p class="eyebrow">เกมทายนักเตะ · เกมละ 10 คน</p>
    <h1>แข้งปริศนา</h1>
    <p class="lede">ใช้คำใบ้ให้น้อยที่สุดแล้วทายชื่อนักเตะ ทายผิดครั้งแรกโดนใบเหลือง ผิดซ้ำเป็นใบแดง</p>
    <div class="decks" id="decks" role="radiogroup" aria-label="ชุดนักเตะ"></div>
    <div class="confirm" id="deckConfirm" hidden>
      <p id="confirmText"></p>
      <div>
        <button type="button" class="deck yes" id="confirmYes">เริ่มเกมใหม่</button>
        <button type="button" class="deck" id="confirmNo">เล่นต่อ</button>
      </div>
    </div>
  </header>

  <section class="board" id="board" aria-label="สกอร์บอร์ด">
    <div class="b-cell"><span class="b-label">คนที่</span><span class="b-num"><span id="bRound">01</span><small>/10</small></span></div>
    <div class="b-cell b-right"><span class="b-label">แต้มรวม</span><span class="b-num" id="bScore">00</span></div>
    <ol class="b-lamps" id="bLamps" aria-label="ผลของแต่ละคน"></ol>
  </section>

  <div class="play" id="play">
    <section class="pitch-wrap" id="pitchWrap" aria-label="ระยะยิง">
      <svg class="pitch" viewBox="-22 0 584 284" role="img" aria-label="แผนผังครึ่งสนาม ลูกบอลยิ่งอยู่ไกลประตูยิ่งได้แต้มมาก">
        <defs>
          <clipPath id="pitchClip"><rect x="-22" y="0" width="584" height="240" rx="8"/></clipPath>
        </defs>
        <g clip-path="url(#pitchClip)">
          <rect class="g1" x="-22" y="0" width="584" height="240"/>
          <path class="g2" d="M33 0h55v240h-55zM143 0h55v240h-55zM253 0h55v240h-55zM363 0h55v240h-55zM473 0h52v240h-52z"/>
          <g class="lines">
            <line x1="0" y1="0" x2="0" y2="240"/>
            <circle cx="0" cy="120" r="91.5"/>
            <line x1="360" y1="0" x2="360" y2="240"/>
            <path d="M360 46.8A91.5 91.5 0 0 0 360 193.2"/>
            <rect x="470" y="28.4" width="55" height="183.2"/>
            <line x1="525" y1="0" x2="525" y2="240"/>
          </g>
          <circle class="spot" cx="0" cy="120" r="3.5"/>
          <circle class="spot" cx="415" cy="120" r="3.5"/>
          <path class="net" d="M525 92h26M525 101h26M525 110h26M525 120h26M525 130h26M525 139h26M525 148h26M533 83.4v73.2M542 83.4v73.2"/>
          <path class="frame" d="M525 83.4h26v73.2h-26"/>
          <line class="shot" id="shot" x1="14" y1="120" x2="520" y2="120"/>
          <g class="ball" id="ball" style="transform:translate(0px,120px)">
            <circle r="10"/>
            <path d="M0-4.6 4.4-1.4 2.7 3.7H-2.7L-4.4-1.4Z"/>
          </g>
        </g>
        <g id="marks"></g>
      </svg>
      <p class="range" id="range" aria-live="polite"></p>
    </section>

    <section class="sheet" aria-label="ใบทะเบียนนักเตะ">
      <header class="sheet-head">
        <h2>ใบทะเบียนนักเตะ</h2>
        <span class="stamp" id="stamp">ปกปิดชื่อ</span>
      </header>
      <ol class="clues" id="clues"></ol>

      <form class="answer" id="answer" autocomplete="off">
        <label for="guess">ชื่อ–นามสกุล</label>
        <div class="answer-row">
          <div class="combo">
            <ul class="suggest" id="suggest" role="listbox" aria-label="รายชื่อนักเตะ" hidden></ul>
            <input id="guess" name="guess" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go"
              placeholder="พิมพ์ชื่อ เช่น ซาลาห์ หรือ Salah" role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list">
          </div>
          <button class="btn solid" id="shoot" type="submit">ยิง!</button>
        </div>
        <p class="hint" id="hint" aria-live="polite"></p>
        <div class="bookings">
          <div class="cards" id="cards"></div>
          <button class="link" id="giveUp" type="button">ยอมแพ้ ดูเฉลย</button>
        </div>
      </form>

      <div class="verdict" id="verdict" hidden>
        <p class="v-call" id="vCall"></p>
        <p class="v-name"><span id="vTh"></span> <span class="v-en" id="vEn"></span></p>
        <p class="v-note" id="vNote"></p>
        <button class="btn solid wide" id="next" type="button"></button>
      </div>
    </section>
  </div>

  <section class="sheet" id="final" hidden aria-label="ผลการแข่งขัน">
    <header class="sheet-head">
      <h2>จบเกม</h2>
      <span class="sheet-side" id="fDeck"></span>

const ROUNDS = 10;
/* ระยะยิงตามจำนวนคำใบ้ที่เปิด: d = เมตรจากเส้นประตู, x = ตำแหน่งบนแผนผัง (525 − d×10) */
const SPOTS = [
  {pts:5, d:52, x:0,   name:'กลางสนาม'},
  {pts:4, d:32, x:205, name:'ระยะไกล'},
  {pts:3, d:18, x:345, name:'หัวกะโหลก'},
  {pts:2, d:11, x:415, name:'จุดโทษ'},
  {pts:1, d:4,  x:485, name:'หน้าปากประตู'}
];
const CLUE_NAMES = ['เกร็ด', 'โปรไฟล์', 'เส้นทางค้าแข้ง', 'ผลงานเด่น', 'เสื้อแข่ง'];
const RANKS = [
  [45, 'ตำนานลูกหนัง',   'รู้ลึกขนาดนี้ ไปนั่งวิเคราะห์บอลหน้าจอได้เลย'],
  [36, 'ซูเปอร์สตาร์',     'ยิงไกลเข้ากรอบแทบทุกลูก'],
  [26, 'ตัวจริงทีมชาติ',   'ฟอร์มนิ่ง ไว้ใจได้ในเกมใหญ่'],
  [16, 'ตัวจริงสโมสร',    'มีของ แต่ยังต้องเก็บประสบการณ์อีกหน่อย'],
  [6,  'ตัวสำรอง',        'อุ่นเครื่องอีกนิด เดี๋ยวก็ได้ลงสนาม'],
  [0,  'เด็กเก็บบอล',     'เริ่มจากข้างสนามก่อน เกมหน้าเอาใหม่']
];

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad2 = n => String(n).padStart(2, '0');
const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
/* ตัดวรรณยุกต์ ไม้ไต่คู้ การันต์ สำเนียงละติน ช่องว่าง และขีด เพื่อให้สะกดต่างกันเล็กน้อยก็ยังค้นเจอ */
function norm(s) {
  return String(s).toLowerCase().normalize('NFD')
    .replace(/[̀-ͯ]/g, '').replace(/[็-๎]/g, '')
    .replace(/ø/g, 'o').replace(/[\s.\-'’​]/g, '');
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem('khaeng.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('khaeng.' + k, JSON.stringify(v)); } catch (e) { /* เล่นต่อได้แม้บันทึกไม่ได้ */ } }
};

const byId = new Map();
PLAYERS.forEach(p => {
  const names = [p.th, p.en, p.back].concat(p.aka || []);
  p.keys = names.map(norm);
  p.words = names.join(' ').split(/[\s\-]+/).map(norm).filter(Boolean);
  byId.set(p.id, p);
});

function search(text) {
  const q = norm(text);
  if (!q) return [];
  const hits = [];
  for (const p of PLAYERS) {
    let rank = -1;
    if (p.keys.some(k => k.startsWith(q))) rank = 0;
    else if (p.words.some(w => w.startsWith(q))) rank = 1;
    else if (q.length >= 2 && p.keys.some(k => k.includes(q))) rank = 2;
    if (rank >= 0) hits.push([rank, p]);
  }
  hits.sort((a, b) => a[0] - b[0] || a[1].th.localeCompare(b[1].th, 'th'));
  return hits.slice(0, 6).map(h => h[1]);
}

/* ---------- เสื้อ ---------- */
const SHIRT = 'M70 10Q100 22 130 10L176 28 198 80 164 94 154 70V196H46V70L36 94 2 80 24 28Z';
let kitSeq = 0;
const maskName = s => s.split(' ').map(w => w.replace(/[A-Z]/g, (c, i) => (i === 0 ? c : '•'))).join(' ');
function shirtSVG(p, masked) {
  const k = KITS[p.kit], cid = 'kit' + (++kitSeq);
  let fill = `<rect width="200" height="204" fill="${k.a}"/>`;
  if (k.p === 'stripes') {
    for (let x = 10; x < 200; x += 36) fill += `<rect x="${x}" width="18" height="204" fill="${k.b}"/>`;
  } else if (k.p === 'check') {
    for (let r = 0; r < 10; r++) for (let c = 0; c < 10; c++) {
      if ((r + c) % 2) fill += `<rect x="${c * 22 - 10}" y="${r * 22 - 6}" width="22" height="22" fill="${k.b}"/>`;
    }
  } else if (k.p === 'sleeves') {
    fill += `<rect width="46" height="204" fill="${k.b}"/><rect x="154" width="46" height="204" fill="${k.b}"/>`;
  } else if (k.p === 'band') {
    fill += `<rect x="80" width="40" height="204" fill="#ffffff"/><rect x="85" width="30" height="204" fill="${k.b}"/>`;
  }
  if (k.p === 'plain' || k.p === 'sleeves') {
    fill += `<path d="M66 6Q100 24 134 6" fill="none" stroke="${k.b}" stroke-width="9"/>` +
            `<rect x="46" y="188" width="108" height="8" fill="${k.b}"/>`;
  }
  const label = masked ? maskName(p.back) : p.back;
  const long = label.length > 8;
  const edge = w => (k.edge ? ` stroke="${k.edge}" stroke-width="${w}" paint-order="stroke" stroke-linejoin="round"` : '');
  const fit = long ? ' textLength="102" lengthAdjust="spacingAndGlyphs"' : ' letter-spacing="1.5"';
  const alt = `เสื้อ${k.t} เบอร์ ${p.no} ชื่อหลังเสื้อ ${label}`;
  return `<svg class="kit-svg" viewBox="0 0 200 204" role="img" aria-label="${esc(alt)}">` +
    `<defs><clipPath id="${cid}"><path d="${SHIRT}"/></clipPath></defs>` +
    `<g clip-path="url(#${cid})">${fill}</g>` +
    `<path d="${SHIRT}" fill="none" stroke="currentColor" stroke-opacity=".4" stroke-width="2" stroke-linejoin="round"/>` +
    `<text x="100" y="60" text-anchor="middle" font-family="Kanit,sans-serif" font-weight="700" font-size="${long ? 16 : 20}"${fit} fill="${k.ink}"${edge(3)}>${esc(label)}</text>` +
    `<text x="100" y="152" text-anchor="middle" font-family="Kanit,sans-serif" font-weight="700" font-size="82" fill="${k.ink}"${edge(6)}>${p.no}</text>` +
    `</svg>`;
}

/* ---------- สถานะเกม ---------- */
let S = null;          // {deck, queue, idx, opened, wrong, phase, results, score}
let pick = null;       // id ที่เลือกจากรายการ
let options = [];      // รายการแนะนำที่แสดงอยู่
let active = -1;
let pendingDeck = null;
let giveUpUntil = 0, giveUpTimer = 0;

const current = () => byId.get(S.queue[S.idx]);
const deckOf = id => DECKS.find(d => d.id === id) || DECKS[0];
const total = () => S.queue.length;

function newGame(deckId) {
  const deck = deckOf(deckId);
  const pool = PLAYERS.filter(deck.test).map(p => p.id);
  const seen = store.get('seen', []).filter(id => byId.has(id));
  const unseen = shuffle(pool.filter(id => !seen.includes(id)));
  const rest = shuffle(pool.filter(id => seen.includes(id)));
  if (unseen.length < ROUNDS) store.set('seen', seen.filter(id => !pool.includes(id)));
  S = {deck: deck.id, queue: shuffle(unseen.concat(rest).slice(0, ROUNDS)), idx: 0, opened: 1, wrong: [], phase: 'play', results: [], score: 0};
  store.set('deck', deck.id);
  pendingDeck = null;
  resetAnswer();
  renderAll();
}
function markSeen(id) {
  const seen = store.get('seen', []);
  if (!seen.includes(id)) { seen.push(id); store.set('seen', seen); }
}

/* ---------- วาดหน้าจอ ---------- */
function renderDecks() {
  $('decks').innerHTML = DECKS.map(d => {
    return `<button type="button" class="deck" role="radio" data-deck="${d.id}" aria-checked="${d.id === S.deck}">${d.name}</button>`;
  }).join('');
  const box = $('deckConfirm');
  box.hidden = !pendingDeck;
  if (pendingDeck) {
    $('confirmText').textContent = pendingDeck === S.deck
      ? 'เริ่มเกมใหม่ตั้งแต่คนแรก? แต้มของเกมนี้จะหายไป'
      : `เปลี่ยนเป็นชุด “${deckOf(pendingDeck).name}” แล้วเริ่มเกมใหม่? แต้มของเกมนี้จะหายไป`;
  }
}

function renderBoard() {
  $('bRound').textContent = pad2(Math.min(S.idx + 1, total()));
  $('bScore').textContent = pad2(S.score);
  const lamps = $('bLamps').children;
  for (let i = 0; i < lamps.length; i++) {
    const r = S.results[i], li = lamps[i];
    li.className = r ? r.outcome : (i === S.idx && S.phase === 'play' ? 'now' : '');
    li.textContent = r ? (r.outcome === 'goal' ? r.pts : r.outcome === 'red' ? 'X' : '-') : '';
    li.title = r ? `คนที่ ${i + 1}: ${r.outcome === 'goal' ? r.pts + ' แต้ม' : r.outcome === 'red' ? 'ใบแดง' : 'ยอมแพ้'}` : `คนที่ ${i + 1}`;
  }
}

function renderPitch() {
  const spot = SPOTS[S.opened - 1];
  const res = S.phase === 'reveal' ? S.results[S.idx] : null;
  const scored = !!res && res.outcome === 'goal';
  $('pitchWrap').dataset.outcome = res ? res.outcome : '';
  $('ball').style.transform = `translate(${scored ? 538 : spot.x}px,120px)`;
  const shot = $('shot');
  shot.setAttribute('x1', spot.x + 14);
  shot.style.visibility = res ? 'hidden' : 'visible';
  const marks = $('marks').children;
  for (let i = 0; i < marks.length; i++) {
    marks[i].setAttribute('class', 'mk' + (i === S.opened - 1 ? ' on' : i < S.opened - 1 ? ' past' : ''));
  }
  let line;
  if (!res) line = `ยิงจาก${spot.name} ${spot.d} ม. · เข้าแล้วได้ <b>${spot.pts} แต้ม</b>`;
  else if (scored) line = `เข้าไปแล้ว! ยิงจาก${spot.name} ${spot.d} ม. ได้ <b>${res.pts} แต้ม</b>`;
  else if (res.outcome === 'red') line = 'โดนใบแดง หมดสิทธิ์ยิงลูกนี้';
  else line = 'ปล่อยบอลออกหลังไป ไม่ได้แต้ม';
  $('range').innerHTML = line;
}

function clueHTML(p, i, reveal) {
  if (i === 0) return esc(p.fact);
  if (i === 1) return `<dl class="facts"><div><dt>ตำแหน่ง</dt><dd>${esc(p.pos)}</dd></div><div><dt>สัญชาติ</dt><dd>${esc(p.nat)}</dd></div><div><dt>เกิดปี</dt><dd>${p.born}</dd></div></dl>`;
  if (i === 2) return `<ol class="path">${p.clubs.map(c => `<li><span>${esc(c)}</span></li>`).join('')}</ol>`;
  if (i === 3) return esc(p.feat);
  const k = KITS[p.kit];
  return `<div class="kit">${shirtSVG(p, !reveal)}<p class="kit-cap">เสื้อ${esc(k.t)} เบอร์ ${p.no}` +
    `<small>ชื่อหลังเสื้อ ${reveal ? esc(p.back) : '<b class="mask">' + esc(maskName(p.back)) + '</b>'}</small></p></div>`;
}
function renderClues() {
  const p = current(), reveal = S.phase === 'reveal';
  const widths = [0, 58, 86, 72, 44];
  $('clues').innerHTML = CLUE_NAMES.map((name, i) => {
    const open = reveal || i < S.opened;
    const next = !reveal && i === S.opened;
    let v;
    if (open) v = clueHTML(p, i, reveal);
    else if (next) v = `<button type="button" class="clue-open" data-open><span>เปิดคำใบ้นี้</span><span class="cost">เหลือ ${SPOTS[i].pts} แต้ม</span></button>`;
    else v = `<span class="bar" style="width:${widths[i]}%"></span>`;
    const late = reveal && i >= S.opened ? '<em>ไม่ได้เปิด</em>' : '';
    return `<li class="clue ${open ? 'open' : next ? 'next' : 'locked'}"><div class="clue-k"><b>${i + 1}</b>${name}${late}</div><div class="clue-v">${v}</div></li>`;
  }).join('');
}

function renderAnswer() {
  const reveal = S.phase === 'reveal';
  $('answer').hidden = reveal;
  $('verdict').hidden = !reveal;
  const stamp = $('stamp');
  stamp.textContent = reveal ? 'เฉลยแล้ว' : 'ปกปิดชื่อ';
  stamp.classList.toggle('done', reveal);
  const booked = S.wrong.length > 0;
  $('cards').innerHTML = `<span class="card${booked ? ' y' : ''}"></span><span class="card"></span>` +
    `<span>${booked ? 'โดนใบเหลืองแล้ว ผิดอีกครั้งคือใบแดง' : 'ยังไม่โดนใบเหลือง'}</span>`;
  if (!reveal) return;
  const p = current(), res = S.results[S.idx], spot = SPOTS[res.opened - 1];
  $('verdict').dataset.outcome = res.outcome;
  $('vCall').innerHTML = res.outcome === 'goal' ? 'โกล!' : res.outcome === 'red' ? '<span class="card r"></span>ใบแดง' : 'ปล่อยผ่าน';
  $('vTh').textContent = p.th;
  $('vEn').textContent = p.en;
  $('vNote').textContent = res.outcome === 'goal'
    ? `ได้ ${res.pts} แต้ม จากการยิงที่${spot.name} ใช้คำใบ้ ${res.opened} ข้อ`
    : res.outcome === 'red' ? 'ตอบผิดสองครั้ง ไม่ได้แต้มจากคนนี้' : 'ไม่ได้แต้มจากคนนี้';
  $('next').textContent = S.idx >= total() - 1 ? 'ดูผลการแข่งขัน' : 'คนถัดไป';
}

function rankOf(score) {
  const scaled = score * 50 / (total() * 5);
  return RANKS.find(r => scaled >= r[0]);
}
function renderFinal() {
  const fin = S.phase === 'final';
  $('play').hidden = fin;
  $('final').hidden = !fin;
  if (!fin) return;
  const deck = deckOf(S.deck), rank = rankOf(S.score), best = store.get('best', {});
  const goals = S.results.filter(r => r.outcome === 'goal').length;
  $('fDeck').textContent = 'ชุด' + deck.name;
  $('fScore').textContent = S.score;
  $('fMax').textContent = `/ ${total() * 5} แต้ม`;
  $('fRank').textContent = 'ระดับ: ' + rank[1];
  $('fLine').textContent = `${rank[2]} · ยิงเข้า ${goals} จาก ${total()} คน · สถิติดีที่สุดของชุดนี้ ${Math.max(best[S.deck] || 0, S.score)} แต้ม`;
  $('fList').innerHTML = S.results.map((r, i) => {
    const p = byId.get(r.id);
    const how = r.outcome === 'goal' ? 'ยิงจาก' + SPOTS[r.opened - 1].name : r.outcome === 'red' ? 'ใบแดง' : 'ยอมแพ้';
    return `<li class="${r.outcome}"><span class="n">${i + 1}</span><span class="who">${esc(p.th)}<small>${esc(p.en)}</small></span>` +
      `<span class="how">${how}</span><span class="pts">${r.pts}</span></li>`;
  }).join('');
  $('copied').textContent = '';
  $('shareBox').hidden = true;
}

function renderAll() {
  renderDecks();
  renderBoard();
  renderFinal();
  if (S.phase !== 'final') { renderPitch(); renderClues(); renderAnswer(); }
}

/* ---------- ช่องตอบและรายการแนะนำ ---------- */
function setHint(text) { $('hint').textContent = text || ''; }
function closeList() {
  options = []; active = -1;
  const ul = $('suggest'), input = $('guess');
  ul.hidden = true; ul.innerHTML = '';
  input.setAttribute('aria-expanded', 'false');
  input.removeAttribute('aria-activedescendant');
}
function openList(list) {
  options = list;
  if (!list.length) { closeList(); return; }
  active = list.findIndex(p => !S.wrong.includes(p.id));
  const ul = $('suggest'), input = $('guess');
  ul.innerHTML = list.map((p, i) => {
    const used = S.wrong.includes(p.id);
    return `<li role="option" id="opt${i}" data-i="${i}" class="${used ? 'used' : ''}" aria-selected="${i === active}" aria-disabled="${used}"><b>${esc(p.th)}</b><span>${esc(p.en)}</span></li>`;
  }).join('');
  ul.hidden = false;
  input.setAttribute('aria-expanded', 'true');
  if (active >= 0) input.setAttribute('aria-activedescendant', 'opt' + active);
}
function moveActive(step) {
  if (!options.length) return;
  let i = active;
  for (let n = 0; n < options.length; n++) {
    i = (i + step + options.length) % options.length;
    if (!S.wrong.includes(options[i].id)) break;
  }
  active = i;
  Array.from($('suggest').children).forEach((li, n) => li.setAttribute('aria-selected', n === active));
  $('guess').setAttribute('aria-activedescendant', 'opt' + active);
  const li = $('opt' + active);
  if (li) li.scrollIntoView({block: 'nearest'});
}
function choose(i) {
  const p = options[i];
  if (!p || S.wrong.includes(p.id)) return;
  pick = p.id;
  $('guess').value = p.th;
  setHint('');
  closeList();
}
function resetAnswer() {
  pick = null;
  $('guess').value = '';
  setHint('');
  closeList();
  clearTimeout(giveUpTimer);
  giveUpUntil = 0;
  $('giveUp').textContent = 'ยอมแพ้ ดูเฉลย';
}

/* ---------- การเล่น ---------- */
function openClue() {
  if (S.phase !== 'play' || S.opened >= CLUE_NAMES.length) return;
  S.opened++;
  renderPitch();
  renderClues();
  const nextBtn = document.querySelector('.clue-open');
  if (nextBtn) nextBtn.focus({preventScroll: true});
}
function endRound(outcome) {
  const p = current();
  const pts = outcome === 'goal' ? SPOTS[S.opened - 1].pts : 0;
  S.results[S.idx] = {id: p.id, outcome, pts, opened: S.opened};
  S.score += pts;
  S.phase = 'reveal';
  markSeen(p.id);
  if (S.idx >= total() - 1) {
    const best = store.get('best', {});
    if (S.score > (best[S.deck] || 0)) { best[S.deck] = S.score; store.set('best', best); }
  }
  resetAnswer();
  renderAll();
  $('guess').blur();
  $('next').focus({preventScroll: true});
  $('verdict').scrollIntoView({block: 'nearest', behavior: reduceMotion() ? 'auto' : 'smooth'});
}
function shoot() {
  if (S.phase !== 'play') return;
  const input = $('guess');
  let id = pick;
  if (!id) {
    const q = norm(input.value);
    if (!q) { setHint('พิมพ์ชื่อนักเตะก่อน แล้วเลือกจากรายการ'); input.focus(); return; }
    const found = search(input.value);
    const exact = found.find(p => p.keys.includes(q));
    if (exact) id = exact.id;
    else if (found.length === 1) id = found[0].id;
    else {
      setHint(found.length ? 'เลือกชื่อจากรายการก่อนยิง' : 'ไม่พบชื่อนี้ ลองสะกดแบบอื่นหรือพิมพ์เป็นภาษาอังกฤษ');
      openList(found);
      return;
    }
  }
  if (S.wrong.includes(id)) { setHint('ชื่อนี้ตอบไปแล้ว'); return; }
  if (id === current().id) { endRound('goal'); return; }
  S.wrong.push(id);
  if (S.wrong.length >= 2) { endRound('red'); return; }
  const wrongName = byId.get(id).th;
  resetAnswer();
  renderAnswer();
  setHint(`ไม่ใช่ ${wrongName}`);
}
function nextRound() {
  if (S.phase !== 'reveal') return;
  if (S.idx >= total() - 1) S.phase = 'final';
  else { S.idx++; S.opened = 1; S.wrong = []; S.phase = 'play'; }
  resetAnswer();
  renderAll();
  $('board').scrollIntoView({block: 'start', behavior: reduceMotion() ? 'auto' : 'smooth'});
}
function chooseDeck(id) {
  const untouched = S.phase === 'final' || (S.idx === 0 && S.opened === 1 && !S.wrong.length && S.phase === 'play');
  if (untouched) { if (id !== S.deck || S.phase === 'final') newGame(id); return; }
  pendingDeck = id;
  renderDecks();
  $('confirmYes').focus({preventScroll: true});
}

function shareText() {
  const row = S.results.map(r => (r.outcome === 'goal' ? '⚽' + r.pts : r.outcome === 'red' ? '🟥' : '➖')).join(' ');
  return `แข้งปริศนา · ชุด${deckOf(S.deck).name}\n${S.score}/${total() * 5} แต้ม · ${rankOf(S.score)[1]}\n${row}`;
}
function copyResult() {
  const text = shareText(), box = $('shareBox');
  const fallback = () => {
    box.value = text; box.hidden = false; box.focus(); box.select();
    $('copied').textContent = 'คัดลอกอัตโนมัติไม่ได้ เลือกข้อความด้านล่างแล้วคัดลอกเอง';
  };
  try {
    navigator.clipboard.writeText(text).then(() => { $('copied').textContent = 'คัดลอกผลแล้ว นำไปวางอวดเพื่อนได้เลย'; }, fallback);
  } catch (e) { fallback(); }
}

/* ---------- เตรียมหน้าและผูกเหตุการณ์ ---------- */
function build() {
  $('bLamps').innerHTML = '<li></li>'.repeat(ROUNDS);
  $('marks').innerHTML = SPOTS.map(s =>
    `<g class="mk"><line x1="${s.x}" y1="240" x2="${s.x}" y2="249"/><circle cx="${s.x}" cy="264" r="14"/><text x="${s.x}" y="270">${s.pts}</text></g>`
  ).join('');
  $('foot').textContent = `นักเตะ ${PLAYERS.length} คน · ข้อมูลถึงฤดูกาล 2025/26 · สีเสื้อเป็นภาพประกอบโดยประมาณ`;

  $('decks').addEventListener('click', e => {
    const b = e.target.closest('[data-deck]');
    if (b) chooseDeck(b.dataset.deck);
  });
  $('confirmYes').addEventListener('click', () => { const id = pendingDeck || S.deck; newGame(id); });
  $('confirmNo').addEventListener('click', () => { pendingDeck = null; renderDecks(); });

  $('clues').addEventListener('click', e => { if (e.target.closest('[data-open]')) openClue(); });

  const input = $('guess'), ul = $('suggest');
  input.addEventListener('input', () => {
    pick = null;
    setHint('');
    openList(search(input.value));
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (options.length) moveActive(1); else openList(search(input.value)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveActive(-1); }
    else if (e.key === 'Escape') { closeList(); }
    else if (e.key === 'Enter' && options.length && active >= 0) { e.preventDefault(); choose(active); }
  });
  ul.addEventListener('pointerdown', e => e.preventDefault());   // ไม่ให้ช่องพิมพ์เสียโฟกัส แป้นพิมพ์จะได้ไม่หุบ
  ul.addEventListener('mousedown', e => e.preventDefault());
  ul.addEventListener('click', e => {
    const li = e.target.closest('li');
    if (li) choose(+li.dataset.i);
  });
  document.addEventListener('pointerdown', e => { if (!e.target.closest('.combo')) closeList(); });

  $('answer').addEventListener('submit', e => { e.preventDefault(); shoot(); });
  $('giveUp').addEventListener('click', () => {
    if (S.phase !== 'play') return;
    if (Date.now() < giveUpUntil) { endRound('skip'); return; }
    giveUpUntil = Date.now() + 3500;
    $('giveUp').textContent = 'แตะอีกครั้งเพื่อยืนยันว่ายอมแพ้';
    clearTimeout(giveUpTimer);
    giveUpTimer = setTimeout(() => { giveUpUntil = 0; $('giveUp').textContent = 'ยอมแพ้ ดูเฉลย'; }, 3500);
  });
  $('next').addEventListener('click', nextRound);
  $('again').addEventListener('click', () => {
    newGame(S.deck);
    $('board').scrollIntoView({block: 'start'});
  });
  $('copy').addEventListener('click', copyResult);
}

function validState(s) {
  return s && Array.isArray(s.queue) && s.queue.length > 0 && s.queue.every(id => byId.has(id)) &&
    Array.isArray(s.results) && Array.isArray(s.wrong) && s.idx >= 0 && s.idx < s.queue.length &&
    s.opened >= 1 && s.opened <= CLUE_NAMES.length && ['play', 'reveal', 'final'].includes(s.phase);
}
function start(data) {
  if (data && validState(data.S)) { S = data.S; resetAnswer(); renderAll(); }
  else newGame(store.get('deck', 'all'));
}

build();
/* ถ้าหน้านี้ถูกอัปเดตระหว่างที่มีคนเล่นอยู่ ให้เกมเดินต่อจากจุดเดิม */
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({S})); } catch (e) { /* ไม่มีผลกับการเล่น */ } }
if (hot && typeof hot.ready === 'function') hot.ready(start);
else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
